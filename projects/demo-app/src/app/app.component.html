<!-- Use: 'tabs' | 'dropdown' | 'none' -->
<ng-moringa-table 
  title="BackLog"
  icon="bi bi-grid"
  [statusMap]="statusMap"
  [variant]="'responsive round-card shadowed'"
  [collapsible]="true"
  [data]="data"
  [progressBy]="'lost'"
  [filterBy]="'status'"
  [filterStyle]="'tabs'"
  [pageSize]="5"
   [valueLenthColumns]="['email', 'organization', 'phone']"
  mediaImage="assets/dummy.jpg"
  [Sorting]="true"
  [paginated]="true"
  [showActions]="true"
  [actionButtons]="[
    {
      label: 'Transfer to',
      tooltip: 'Transfer to leads',
      className: 'icon-btn-success',
      isDropdown: true,
      options: ['lead board', 'Actives', 'scheduled']
    },
    {
      label: 'Delete',
      icon: 'bi bi-trash',
      tooltip: 'Delete Lead',
      className: 'icon-btn-danger'
    },
    {
      label: 'Copy',
      icon: 'bi bi-files',
      tooltip: 'Copy Details',
      className: 'icon-btn-info'
    }
  ]"
/>
