

<ng-matric-table
  title="main Tilte"
  icon="bi bi-grid"
  [headerButtons]="[
    {
      icon: 'bi bi-plus',
      label: 'Options',
      tooltip: 'Dropdown for table',
      className: 'success',
      isDropdown: true,
      targetId: 'header-dropdown-btn',
      options: ['lead board', 'Actives', 'scheduled']
    },
    {
      label: 'New',
      icon: 'bi bi-plus',
      tooltip: 'New Lead',
      className: 'danger',
      targetId: 'header-delete-btn'
    },

  ]"
  [data]="data"
  [statusMap]="statusMap"
  [variant]="'round-card bordered  responsive'"
  [collapsible]="true"
  [progressBy]="'lost'"
  [filterBy]="'status'"
  [filterStyle]="['tabs', 'keyword', 'dropdown', 'date']"
  [pageSize]="3"
  [valueLenthColumns]="['email', 'organization', 'phone', 'tags']"
  mediaImage="assets/dummy.jpg"
  [Sorting]="true"
  [paginated]="true"
  [showActions]="true"
  [actionButtons]="[
    {
      label: 'Dropdown',
      tooltip: 'Dropdown for table',
      className: 'success',
      isDropdown: true,
      options: ['lead board', 'Actives', 'scheduled']
    },
    {
      label: 'Delete',
      icon: '',
      tooltip: 'Delete Lead',
      className: 'danger'
    },
   
  ]"
/>
