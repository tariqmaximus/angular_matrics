<!-- table VIEW -->
<div class="table-wrapper" *ngIf="currentViewType === 'table'">
  <table>
    <thead>
      <tr>
        <th *ngFor="let column of columns; let colIndex = index" (click)="Sorting ? sortByColumn(column.key) : null"
          class="text-nowrap text-start align-middle " style="cursor: pointer;" scope="col">
          <div class="sorting-group">
            <!-- Always show Select All checkbox -->
            <ng-container *ngIf="colIndex === 0">
              <div class="checkbox-wrapper">
                <input class="inp-cbx" [id]="prefix + '-cbx-header'" type="checkbox"
                  (click)="$event.stopPropagation()" (change)="toggleAllRows($event)" [checked]="isAllSelected()" />

                <label class="cbx" [for]="prefix + '-cbx-header'">
                  <div class="checkbox">
                    <svg width="12px" height="10px" viewBox="0 0 12 10">
                      <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
                    </svg>
                  </div>
                  <div *ngIf="selectedRows.length > 1" class="metrics-dropdown">
                    <button class="metrics-btn no-bg " (click)="toggleDropdown(-1, $event)">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-three-dots-vertical" viewBox="0 0 16 16">
                        <path
                          d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" />
                      </svg>
                    </button>
                    <ul class="dropdown-menu" [class.show]="dropdownShownIndex === -1">
                      <li *ngFor="let btn of actionButtons">
                        <button class="dropdown-item" (click)="handleBulkAction(btn)">
                          {{ btn.label }}
                        </button>
                      </li>
                    </ul>
                  </div>

                </label>
              </div>
            </ng-container>
            <!-- Column Label -->
            <span>{{ column.label }}</span>

            <!-- Sort Icon -->
            <ng-container *ngIf="Sorting">
              <svg *ngIf="sortKey === column.key && sortAsc" xmlns="http://www.w3.org/2000/svg" width="16"
                height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                  d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5" />
              </svg>

              <svg *ngIf="sortKey === column.key && !sortAsc" xmlns="http://www.w3.org/2000/svg" width="16"
                height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                  d="M8 1a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L7.5 13.293V1.5A.5.5 0 0 1 8 1" />
              </svg>

              <svg *ngIf="sortKey !== column.key" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                  d="M11.5 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L11 2.707V14.5a.5.5 0 0 0 .5.5m-7-14a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L4 13.293V1.5a.5.5 0 0 1 .5-.5" />
              </svg>
            </ng-container>

          </div>
        </th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let data of pagedData; let i = index; trackBy: trackByIndex">
        <tr [ngClass]="{ 'dynamic-row': activeRowIndex === i }">
          <td *ngFor="let column of columns">
            <ng-container [ngSwitch]="column.key">
              <ng-container *ngSwitchCase="'mediaTile'">
                <div class="metrics-group">
                  <div class="checkbox-wrapper">
                    <input class="inp-cbx" [id]="prefix + '-cbx-' + i" type="checkbox"
                        (change)="toggleSelectRow(data, $event)" [checked]="selectedRows.includes(data)" />
                    <label class="cbx" [for]="prefix + '-cbx-' + i">
                      <div class="checkbox">
                        <svg width="12px" height="10px" viewBox="0 0 12 10">
                          <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
                        </svg>
                      </div>
                      <p class=""></p>
                    </label>
                  </div>
                  <div class="media-tile">
                    <div class="media-img " [ngClass]="statusMap[data.status]">
                        <img *ngIf="data.mediaTile && !imageLoadFailedMap[data?.id || data?.[searchKey] || data?.name]"
                          class="img-fluid" [src]="data.mediaTile || mediaImage" alt="Media Image"
                          (error)="handleImageError($event, data)" />
                        <span *ngIf="!data.mediaTile || imageLoadFailedMap[data?.id || data?.[searchKey] || data?.name]"
                          class="letter-fallback">
                          {{ (data.name || '??').substring(0, 2).toUpperCase() }}
                        </span>
                      </div>
                      <div class="media-details">
                        <p class="name text-dark">{{ data.name || 'Unknown' }}</p>
                        <p class="text-muted">{{ data.source || 'No Information' }}</p>
                    </div>
                  </div>
                  <button class="metrics-btn mobile-btn" (click)="toggleRowClass(i)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                      viewBox="0 0 16 16" class="transition-icon" [ngClass]="{ 'rotate-90': activeRowIndex === i }">
                      <path fill-rule="evenodd"
                        d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708" />
                    </svg>
                  </button>
                </div>

              </ng-container>
              <ng-container *ngSwitchCase="'status'">
                  <span [ngClass]="getStatusStyles(data.status).tagClass">
                    {{ getValue(data, column.key) }}
                </span>
              </ng-container>
              <ng-container *ngSwitchCase="'action'">
                <div class="metrics-btn-group sm align-right ">
                  <ng-container *ngFor="let btn of actionButtons">
                    <button *ngIf="!btn.isDropdown" class="metrics-btn" [ngClass]="btn.className"
                      [attr.title]="btn.tooltip" (click)="handleButtonClick(btn, data)">
                      <i *ngIf="btn.icon" [class]="btn.icon"></i>
                      {{ btn.label }}
                    </button>
                    <div *ngIf="btn.isDropdown" class="metrics-dropdown metrics-btn">
                      <button class="metrics-btn no-bg metrics-btn-toggle" (click)="toggleDropdown(i, $event)"
                        [ngClass]="btn.className" [attr.title]="btn.tooltip">
                        {{ btn.label }}
                      </button>
                      <ul class="dropdown-menu" [class.show]="dropdownShownIndex === i">
                        <li *ngFor="let option of btn.options">
                          <button class="dropdown-item" (click)="handleDropdownClick(option, btn, data)">
                            {{ option }}
                          </button>
                        </li>
                      </ul>
                    </div>
                  </ng-container>
                </div>
              </ng-container>
              <ng-container *ngSwitchDefault>
                <span class="value" [ngClass]="{ 'value-lenth': shouldApplyValueLenth(column.key) }"
                    [attr.title]="shouldApplyValueLenth(column.key) ? getValue(data, column.key) : null">
                    {{ getValue(data, column.key) }}
                </span>
              </ng-container>
            </ng-container>
          </td>
      </ng-container>
      <tr *ngIf="pagedData.length === 0">
        <td [attr.colspan]="columns.length + 2" class="text-center py-3">
          No records found.
        </td>
      </tr>
    </tbody>
    <tfoot *ngIf="paginated">
      <tr>
        <td>
          <ng-content select="[footer-component]"></ng-content>
        </td>
        <td [attr.colspan]="columns.length + 0">
          <div class="pagination metrics-btn-group align-right ">
            <button class="metrics-btn" (click)="prevPage()" [disabled]="currentPage === 1">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-chevron-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                  d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0" />
              </svg>
            </button>
            <span class="metrics-btn">Page {{ currentPage }} of {{ totalPages }}</span>
            <button class="metrics-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-chevron-right" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                  d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708" />
              </svg>
            </button>
          </div>
        </td>
      </tr>
    </tfoot>
  </table>
</div>
